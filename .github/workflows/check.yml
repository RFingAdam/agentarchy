name: check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install tools
        env:
          GITLEAKS_VERSION: 8.21.2
          # sha256 of gitleaks_8.21.2_linux_x64.tar.gz, from the release's
          # gitleaks_8.21.2_checksums.txt. Bump both together.
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck bats file
          curl -fsSL --retry 3 -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
          rm -f gitleaks.tgz
      - name: Cache upstream tarball
        uses: actions/cache@v6
        with:
          path: ~/.cache/agentarchy/upstream
          key: upstream-${{ hashFiles('upstream/PIN') }}
      - name: Run gates
        run: bin/oal-dev-check
      - name: Full-history secret scan
        run: gitleaks detect --no-banner --redact --source . -c .gitleaks.toml --log-opts="--all"
