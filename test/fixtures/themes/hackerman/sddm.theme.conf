# SDDM greeter palette, generated from a theme's colors.toml.
#
# SDDM exposes every key in this file's [General] section to the theme's QML as config.<key>, which
# is the only channel a greeter has: it runs as the sddm user, long before anyone's session exists,
# so it cannot read kdeglobals or the current-theme symlink. Main.qml gives each read a literal
# fallback, so a greeter installed without this file still renders.
#
# Rendered by bin/oal-theme-render into the installed theme directory. That directory is under
# /usr/share/sddm/, so only root can write it -- bin/oal-refresh-sddm does, and oal-bootstrap.sh
# calls it during install. A theme switch afterwards cannot, and says so rather than pretending.

[General]
background=#0B0C16
lighter_background=#151828
foreground=#ddf7ff
muted=#2d3450
red=#50f872
mode=dark
