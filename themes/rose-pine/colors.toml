# Rosé Pine, the dark original.
#
# What upstream shipped under this name was Rosé Pine *Dawn*, the light variant wearing the
# flagship's name. It was dropped in the identity pass rather than converted, because converting it
# is not a port: Rosé Pine defines no green and no distinct blue and cyan, and this palette's keys
# are used semantically across eighteen templates rather than as a sixteen-colour ANSI table. Two
# colours have to be designed. This file is native rather than vendored for that reason.
#
# Straight from the upstream specification, unchanged:
#
#   base #191724   surface #1f1d2e   overlay #26233a   muted #6e6a86   subtle #908caa
#   text #e0def4   love #eb6f92      gold #f6c177      rose #ebbcba    pine #31748f
#   foam #9ccfd8   iris #c4a7e7      highlight-med #403d52
#
# The three decisions, so nobody has to reverse-engineer them:
#
#   green is invented. Rosé Pine has none. Its published terminal mapping puts pine -- a blue-teal --
#   in the green slot, which is fine for an ANSI table and wrong here, where `green` means "this
#   succeeded" and colours diff additions. #7fb39b is a dusty seafoam chosen to sit between pine and
#   foam so it reads as part of the family rather than borrowed from another palette.
#
#   blue is pine and cyan is foam, rather than the published mapping's blue=foam, cyan=rose. Rose is
#   pink; a template asking for cyan and getting pink is a bug with extra steps.
#
#   orange and brown are derived, since the palette has neither. Orange sits between gold and love,
#   brown is a muted rose taken well down. Both are used rarely and neither carries meaning that a
#   near-miss would break.

mode = "dark"

accent = "#c4a7e7"
selection = "#403d52"
muted = "#6e6a86"

background = "#191724"
dark_background = "#14121d"
darker_background = "#100e17"
lighter_background = "#1f1d2e"

foreground = "#e0def4"
dark_foreground = "#908caa"
light_foreground = "#e8e6f8"
bright_foreground = "#f2f0fb"

red = "#eb6f92"
yellow = "#f6c177"
orange = "#ee9a86"
green = "#7fb39b"
cyan = "#9ccfd8"
blue = "#31748f"
magenta = "#c4a7e7"
brown = "#9c7f78"

bright_red = "#f2879f"
bright_yellow = "#f9d199"
bright_green = "#9ecab5"
bright_cyan = "#b6dfe6"
bright_blue = "#4a92ad"
bright_magenta = "#d4bdf0"
