[extend]
useDefault = true

[allowlist]
description = "Agentarchy allowlist"
paths = [
  # The gitleaks-worktree gate scans the filesystem (--no-git), which does not honour .gitignore.
  # Both directories below are gitignored scratch -- the sync stage, and the per-phase session and
  # review artifacts -- so nothing in them can reach a commit; the git-history gate covers
  # everything that can. Without this, the stage rescans every vendored file and the review diffs
  # re-report findings already allowlisted at their real path.
  '''^\.sync/''',
  '''^\.superpowers/''',
  # Same reasoning for the VM harness scratch (test/vm/README.md): both are gitignored, and the
  # multi-gigabyte qcow2 disks in them are what the filesystem scan chokes on -- gitleaks reads a
  # file into memory, so a 24 G disk image is an out-of-memory kill, not a finding.
  '''^\.vm/''',
  '''^\.vm-cache/''',
  '''test/fixtures/.*''',
  '''themes/.*/backgrounds/.*''',
  # bin/oal-install-chromium-google-account: the OAuth2 client id/secret here is the public pair
  # Chromium's own open-source project publishes to enable "Sign in to Chromium" (used unmodified
  # by many distro chromium packages, e.g. Arch's); it is not a real secret. The file is vendored
  # (see upstream/VENDORED-FILES.txt) and must not be hand-edited, so it is allowlisted here.
  '''bin/oal-install-chromium-google-account''',
]
