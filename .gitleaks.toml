[extend]
useDefault = true

[allowlist]
description = "Agentarchy allowlist"
paths = [
  # Both gates now see only files that can reach a commit -- the history gate reads committed
  # blobs, and bin/oal-dev-gitleaks-worktree stages `git ls-files --cached --others
  # --exclude-standard`. Gitignored scratch (.sync/, .superpowers/, .vm/, .vm-cache/,
  # .claude/worktrees/) therefore needs no entry here, which is the point: a path allowlist only
  # suppresses findings, so it never stopped the multi-gigabyte reads that OOM-killed the gate.
  '''test/fixtures/.*''',
  '''themes/.*/backgrounds/.*''',
  # bin/oal-install-chromium-google-account: the OAuth2 client id/secret here is the public pair
  # Chromium's own open-source project publishes to enable "Sign in to Chromium" (used unmodified
  # by many distro chromium packages, e.g. Arch's); it is not a real secret. The file is vendored
  # (see upstream/VENDORED-FILES.txt) and must not be hand-edited, so it is allowlisted here.
  '''bin/oal-install-chromium-google-account''',
]
